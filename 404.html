  <style>
/* --- Root Variables (Default Light Theme / Parchment) --- */
:root {
    /* Typography */
    --font-family-body: "Junicode", serif;
    --font-family-heading: "Cinzel", serif;
    --font-mono: "IBM Plex Mono", monospace;

    /* Layout Spacing (Global) */
    /* Base size: 1rem is typically 16px */
    --space-xs: 0.25rem; /* 4px */
    --space-sm: 0.5rem; /* 8px */
    --space-md: 1rem; /* 16px */

    /* Global Defaults */
    --gallery-height: 300px;

    /* Colors */
    --color-background-primary: #fdf6e3;
    --color-background-secondary: #eee8db;
    --color-background-tertiary: #dcd3c3;
    --color-text-primary: #1c1915;
    --color-text-secondary: #5c5449;
    --color-text-heading: #3d2b1a;
    --color-border-primary: #cec6b4;
    --color-accent-primary: #6d4c2a;
    --color-icons: var(--color-accent-primary);

    /* Semantic Colors */
    --color-text-link: #1a6eb5;
    /* File tree: distinct from --color-icons (uses syntax accent, safe for mask icons) */
    --color-published-resource: var(--code-tag);
    --color-text-link-broken: #a83232;
    --color-text-error: #8b0000; /* darkred */
    --color-background-error: rgba(139, 0, 0, 0.1);
    --color-border-error: rgba(139, 0, 0, 0.2);

    /* UI Element Colors */
    --color-overlay-subtle: rgba(0, 0, 0, 0.02);
    --color-overlay-light: rgba(0, 0, 0, 0.03);
    --color-overlay-medium: rgba(0, 0, 0, 0.05);
    --color-overlay-dark: rgba(0, 0, 0, 0.07);
    --color-overlay-resizer: var(--color-overlay-subtle);
    --color-overlay-resizer-hover: var(--color-overlay-dark);

    /* UI Geometry */
    --radius-base: 4px;
    --select-arrow: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");

    /* --- SYNTAX HIGHLIGHTING (Default) --- */
    --code-tag: #005f6a; /* Deep Teal */
    --code-attribute: #8c4a10; /* Warm Sienna */
    --code-string: #3a6e28; /* Forest Green */
    --code-background-inline: var(--color-background-secondary);
}

/* --- Slate & Chalk (Dark Theme) --- */
[data-theme="dark"] {
    --color-background-primary: #23232a; /* Deep blue-gray slate */
    --color-background-secondary: #2e2e38;
    --color-background-tertiary: #3c3c48;
    --color-text-primary: #e4e0d8; /* Warm chalk white */
    --color-text-secondary: #9a9590; /* Warm medium gray */
    --color-text-heading: #cfc9c0; /* Softer chalk for headings */
    --color-border-primary: #464650;
    --color-accent-primary: #8a9bb0; /* Muted slate blue accent */

    --color-text-link: #7eb5e8; /* Soft blue for dark background */
    --color-text-link-broken: #f4a0a0; /* Soft red */
    --color-text-error: #ef4444;
    --color-background-error: rgba(239, 68, 68, 0.1);
    --color-border-error: rgba(239, 68, 68, 0.2);

    --color-overlay-subtle: rgba(255, 255, 255, 0.02);
    --color-overlay-light: rgba(255, 255, 255, 0.03);
    --color-overlay-medium: rgba(255, 255, 255, 0.05);
    --color-overlay-dark: rgba(255, 255, 255, 0.07);

    /* Syntax Highlighting */
    --code-tag: #c792ea; /* Soft purple */
    --code-attribute: #82aaff; /* Cornflower blue */
    --code-string: #c3e88d; /* Sage green */
    --color-published-resource: var(--code-tag);
}

[data-theme="burgundy"] {
    /* Wine theme */
    --color-text-heading: #6b2222; /* A deeper, darker aged wine for solid readability on parchment */
    --color-accent-primary: #943030; /* A slightly brighter, richer burgundy for interactive UI accents */
}

[data-theme="slate-and-gold"] {
    /* Dark theme */
    --color-background-primary: #2a2a2e; /* Dark slate background */
    --color-background-secondary: #3a3a3e;
    --color-background-tertiary: #4a4a4e;
    --color-text-primary: #e0e0e0; /* Light chalk text */
    --color-text-secondary: #a0a0a0;
    --color-border-primary: #444448;

    --color-text-link: #60a5fa; /* Lighter blue for links */
    --color-text-link-broken: #fca5a5; /* Lighter red */
    --color-text-error: #ef4444; /* Bright red */
    --color-background-error: rgba(239, 68, 68, 0.1);
    --color-border-error: rgba(239, 68, 68, 0.2);

    --color-overlay-subtle: rgba(255, 255, 255, 0.02);
    --color-overlay-light: rgba(255, 255, 255, 0.03);
    --color-overlay-medium: rgba(255, 255, 255, 0.05);
    --color-overlay-dark: rgba(255, 255, 255, 0.07);

    /* Gold theme */
    --font-family-heading: "Cinzel", serif;
    --color-text-heading: #bda242; /* A deeper, warm muted gold */
    --color-accent-primary: #d4c585; /* Softer, paler gold */

    /* Syntax Highlighting */
    --code-tag: #da70d6; /* Orchid/Amethyst (Purple stands out from Gold) */
    --code-attribute: #00ced1; /* Dark Turquoise (Gemstone Blue) */
    --code-string: #adff2f; /* Green-Yellow (Peridot - distinct brightness) */
    --color-published-resource: var(--code-tag);
}

/* --- Sci-Fi Hologram Theme --- */
[data-theme="hologram"] {
    --color-background-primary: #020a1f; /* Deep space blue */
    --color-background-secondary: #0d275a;
    --color-background-tertiary: #1a3a7a;
    --color-text-primary: #00fbfd; /* Glowing cyan */
    --color-text-secondary: #00a8aa;
    --color-border-primary: #1a568c;
    --color-accent-primary: var(--color-text-secondary);
    --color-text-heading: var(
        --color-text-primary
    ); /* Cyan headings match body */

    --color-text-link: #39ff14; /* Neon green */
    --color-text-link-broken: #fffb00; /* Deep amber */
    --color-text-error: #ff5555; /* Glowing red */
    --color-background-error: rgba(255, 85, 85, 0.1);
    --color-border-error: rgba(255, 85, 85, 0.2);

    --color-overlay-subtle: rgba(0, 251, 253, 0.03);
    --color-overlay-light: rgba(0, 251, 253, 0.05);
    --color-overlay-medium: rgba(0, 251, 253, 0.07);
    --color-overlay-dark: rgba(0, 251, 253, 0.1);

    /* Syntax Highlighting */
    --code-tag: #d542ff;
    --code-attribute: #ffe600;
    --code-string: #ff5e78;
    --color-published-resource: var(--code-tag);
}

[data-theme="professional"] {
    /* --- Colors (Clean & Professional Palette) --- */
    --color-background-primary: #ffffff;
    --color-background-secondary: #f8f9fa;
    --color-background-tertiary: #e9ecef;
    --color-text-primary: #212529;
    --color-text-secondary: #6c757d;
    --color-border-primary: #dee2e6;

    /* Professional Polish: Distinct Heading and Accent */
    --color-text-heading: #1a1e21; /* Slightly darker, deeper charcoal for structural weight */
    --color-accent-primary: #0d6efd; /* The standard professional blue for interactive elements */

    /* --- Semantic Colors --- */
    --color-text-link: var(--color-accent-primary);
    --color-text-link-broken: #dc3545;
    --color-text-error: #dc3545;
    --color-background-error: rgba(220, 53, 69, 0.1);
    --color-border-error: rgba(220, 53, 69, 0.2);

    /* Syntax Highlighting (Professional) */
    /* Concept: "GitHub Light" style. Clean and familiar. */
    --code-tag: #e45649; /* Soft Red */
    --code-attribute: #0184bc; /* Cerulean Blue (Crisp) */
    --code-string: #50a14f; /* Vivid Green */
    --color-published-resource: var(--code-tag);
}

[data-theme="paneidos"] {
    --color-background-primary: #eadcc5;
    --color-background-secondary: #ede0c6;
    --color-background-tertiary: #d3bd8c;
    --color-text-heading: #600000;
    --color-text-primary: #000000;
    --color-text-secondary: #3d2424;
    --color-border-primary: #300000;
    --color-accent-primary: #320606;
    --color-text-link: #c31d1d;
    --color-text-link-broken: #b04a4a;
    --color-text-error: #ff0000;
    --code-tag: #b58900;
    --code-attribute: #268bd2;
    --code-string: #2aa198;
    --color-published-resource: var(--code-tag);
}

/* Global Styles */

h1,
h2,
h3,
h4,
h5,
h6 {
    font-family: var(--font-family-heading);
    color: var(
        --color-text-heading,
        var(--color-text-secondary)
    ); /* Fallback to --color-text-secondary if --color-text-heading isn't defined */
}

body,
html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: var(--font-family-body);
    background-color: var(--color-background-primary);
    color: var(--color-text-primary);
}

/* Global hr style */
hr {
    border: none;
    border-top: 1px solid var(--color-border-primary);
    margin: 0.5rem 0;
}

/* Scrollbar styling */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: var(--color-overlay-medium);
}

::-webkit-scrollbar-thumb {
    background-color: var(--color-border-primary);
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background-color: var(--color-text-secondary);
}

/* --- Global Helper Classes --- */

/* A reusable class for elements that should look and act like links,
   and the global style for all real <a> tags. */
.link-button,
a[href] {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    color: var(--color-text-link);
    text-decoration: none;
    border-bottom: 1px dotted var(--color-text-link);
    text-align: left;
}

.link-button:hover,
.link-button:focus,
a[href]:hover {
    text-decoration: underline;
    outline: none;
}

/* A reusable class for muted, italicized text, like "No results found" */
.text-muted {
    color: var(--color-text-secondary);
    font-style: italic;
}

/* A reusable class for centering text */
.text-center {
    text-align: center;
}

/* --- Global Error Box Style --- */
/* This is the single source of truth for error messages, whether they
   are generated by the Rust backend or the ErrorBox.svelte component. */
.error-box {
    border: 1px solid var(--color-border-error);
    border-radius: var(--radius-base);
    padding: 0.75rem;
    margin-bottom: 1rem;
    background-color: var(--color-background-error);
    color: var(--color-text-error);
    font-family: var(--font-mono);
    font-size: 0.9rem;
}

.error-box strong {
    display: block;
    margin-bottom: 0.25rem;
}

/* --- Shared Form Elements --- */

/* Standard Text Input */
.form-input {
    background: var(--color-background-secondary);
    border: 1px solid var(--color-border-primary);
    color: var(--color-text-primary);
    padding: 0.6rem;
    border-radius: 6px;
    font-size: 0.95rem;
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    transition:
        border-color 0.2s,
        box-shadow 0.2s;
}

.form-input:focus {
    outline: 2px solid var(--color-accent-primary);
    outline-offset: -1px;
}

/* Standard Dropdown Select */
.dropdown-select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: var(--select-arrow);
    background-repeat: no-repeat;
    background-position: right 0.75rem center;
    background-size: 1.2em;
    width: 100%;
    padding: 0.5rem;
    padding-right: 2.5rem; /* Space for the arrow */
    font-family: inherit;
    font-size: 1rem;
    border: 1px solid var(--color-border-primary);
    background-color: var(--color-background-secondary);
    color: var(--color-text-primary);
    border-radius: 6px;
    box-sizing: border-box;
    cursor: pointer;
    transition:
        border-color 0.2s,
        box-shadow 0.2s;
}

.dropdown-select:focus {
    outline: none;
    border-color: var(--color-accent-primary);
}

/* Standard Dropdown / Popup Menu Container */
.dropdown-menu {
    background: var(--color-background-secondary);
    border: 1px solid var(--color-border-primary);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    z-index: 9999;
    overflow-y: auto;
    padding: 0;
    margin: 0;
}

/* Global Reset for Lists inside Dropdowns */
.dropdown-menu ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

/* Standard Dropdown Items (Buttons) */
.dropdown-menu button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 0.5rem 0.8rem;
    cursor: pointer;
    color: var(--color-text-primary);
    font-size: 0.9rem;
    display: block;
    transition: background-color 0.1s ease;
}

/* State: Navigation Highlight (Hover or Arrow Keys) */
.dropdown-menu button.highlighted,
.dropdown-menu button:hover {
    background-color: var(--color-accent-primary);
    color: var(--color-background-primary); /* Contrast text against accent */
}

/* State: Selected / Active Value (e.g. checkmark state) */
.dropdown-menu button.selected {
    font-weight: bold;
    /* Use tertiary background to distinguish 'chosen' from 'hovering' */
    background-color: var(--color-background-tertiary);
    color: var(--color-text-primary);
}

/* Ghost / Icon Button */
.icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.25rem;
    color: var(--color-text-secondary);
    transition:
        color 0.2s,
        opacity 0.2s,
        background-color 0.2s;
    display: inline-flex;

  <style>/* This file contains all styles related to the rendered content (Markdown preview).
    It is scoped to the .chronicler-content class to prevent leaking into the App Shell.
*/

/* --- Base Container --- */
.chronicler-content {
    line-height: 1.7;
    font-family: var(--font-family-body);
}

/* --- Typography --- */
.chronicler-content h1,
.chronicler-content h2,
.chronicler-content h3,
.chronicler-content h4,
.chronicler-content h5,
.chronicler-content h6 {
    font-family: var(--font-family-heading);
    /* * Using 'overflow: hidden' creates a new block formatting context,
     * which makes the header's block (including its border) correctly
     * wrap around floats like the infobox.
     */
    overflow: hidden;
    clear: left;
}

.chronicler-content h1,
.chronicler-content h2,
.chronicler-content h3 {
    border-bottom: 1px solid var(--color-border-primary);
    padding-bottom: 0.3em;
    margin-top: 1.5em;
    margin-bottom: 0.3em;
}

.chronicler-content h1 + p,
.chronicler-content h2 + p,
.chronicler-content h3 + p {
    margin-top: 0;
}

/* --- Paragraphs --- */
/* Reset margins to remove browser defaults */
.chronicler-content p {
    margin-block: 0;
}

/* Add margin only between consecutive paragraphs for spacing that scales with font size */
.chronicler-content p + p {
    margin-block-start: 1rem;
}

/* --- Blockquotes --- */
.chronicler-content blockquote {
    border-left: 3px solid var(--color-border-primary);
    padding-left: 1em;
    margin-left: 0;
    font-style: italic;
    color: var(--color-text-secondary);
}

/* --- Code Blocks --- */
/* Inline code: `like this` */
.chronicler-content :not(pre) > code {
    background-color: var(--color-overlay-medium);
    padding: 0.2em 0.4em;
    border-radius: 3px;
}

/* Fenced code block container (```) */
.chronicler-content pre {
    background-color: var(--color-overlay-medium);
    padding: 1em;
    border-radius: 4px;
    overflow-x: auto;
}

/* Code inside fenced block */
.chronicler-content pre > code {
    background-color: transparent;
    padding: 0;
}

/* --- Tables --- */
/* Force tables to become scrollable blocks when they are too wide.
   This prevents them from expanding the parent container. */
.chronicler-content table {
    /* Critical Layout Resets */
    display: block; /* Behave like a div wrapper */
    max-width: 100%; /* Ensure it never exceeds the parent container width */
    overflow-x: auto; /* Add a scrollbar if content is wider than width */

    /* Aesthetics */
    border-collapse: collapse;
    margin-block: 1.5em;
    font-size: 0.95rem;
    line-height: 1.5;
}

.chronicler-content th,
.chronicler-content td {
    border: 1px solid var(--color-border-primary);
    padding: 0.6em 0.8em;
}

.chronicler-content th {
    background-color: var(--color-overlay-light);
    font-weight: bold;
}

/* Remove borders from cells inside a table with border="0" */
.chronicler-content table[border="0"] th,
.chronicler-content table[border="0"] td {
    border: none;
}

/* --- Links --- */
.chronicler-content a.internal-link {
    color: var(--color-text-link);
    text-decoration: none;
    border-bottom: 1px dotted var(--color-text-link);
    cursor: pointer;
}

.chronicler-content a.internal-link.broken {
    color: var(--color-text-link-broken);
    text-decoration: none;
    border-bottom: 1px dotted var(--color-text-link-broken);

.chronicler-content .footnote-definition p {
    display: inline;
    margin-left: 0.5em;
}

/* --- Spoilers --- */
.chronicler-content span.spoiler {
    background-color: var(--color-overlay-dark);
    color: transparent;
    cursor: pointer;
    padding: 0 0.2em;

.chronicler-content span.spoiler a.internal-link,
.chronicler-content span.spoiler a.internal-link.broken {

.chronicler-content span.spoiler.revealed a.internal-link {

    border-bottom-color: var(--color-text-link);

.chronicler-content span.spoiler.revealed a.internal-link.broken {

    border-bottom-color: var(--color-text-link-broken);
}

/* --- Inserts / Transclusions --- */
.chronicler-content .insert-container {
    border: 1px solid var(--color-border-primary);
    border-left-width: 3px;
    border-left-color: var(--color-accent-primary);
    border-radius: var(--radius-base);

.chronicler-content .insert-header {

    padding: 0.5rem 0.75rem;

}

.chronicler-content .insert-title-wrapper {

    align-items: center;

.chronicler-content .insert-title-wrapper.centered {
    flex: 1;

}

.chronicler-content .insert-toggle {
    background: none;
    border: none;

    font-size: 0.8rem;

.chronicler-content .insert-toggle:hover {

}

.chronicler-content .insert-content {
    padding: 0.75rem;
    transition: all 0.2s ease-in-out;
}

/* Collapsed state for inserts */
.chronicler-content .insert-container.collapsed {
    background-color: transparent;
    box-shadow: none;
    border-color: transparent;
    border-left-color: transparent;
    padding-left: 0;

.chronicler-content .insert-container.collapsed .insert-header {

    border-radius: var(--radius-base);

.chronicler-content .insert-container.collapsed .insert-header:hover {
    background-color: var(--color-background-secondary);
    border-color: var(--color-accent-primary);
}

.chronicler-content .insert-container.collapsed .insert-content {
    display: none;
}

/* --- Generic Media Constraints --- */
/* Ensure images never overflow their container */
.chronicler-content img {
    max-width: 100%;
    height: auto; /* Maintains aspect ratio */
}

/* --- Preview Gallery specific styles --- */
/* Apply base styles to ALL images inside a gallery */
.chronicler-content .gallery {
    display: grid;
    /* We use a local variable --gallery-width for the width.
       This allows us to change the aspect ratio easily in modifier classes.
    */
    grid-template-columns: repeat(auto-fill, var(--gallery-width));
    gap: 1rem;
    margin-block: 1.5em;
    align-items: start;

    /* Default to Square (300x300) */
    --gallery-height: 300px;
    --gallery-width: 300px;

/* Modifier: Small (Square 150x150) */
.chronicler-content .gallery.small {

/* Modifier: Large (Square 450x450) */
.chronicler-content .gallery.large {

}

/* Modifier: Landscape (Wide 400x225)
   Great for Maps or Scenery!
*/
.chronicler-content .gallery.landscape {
    --gallery-height: 225px;
    --gallery-width: 400px;
}

/* Common container styles */
.chronicler-content .gallery figure,
.chronicler-content .gallery .gallery-item-wrapper {
    position: relative;
    overflow: hidden; /* Clips the blurred background */
    margin: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--color-border-primary);
    border-radius: 4px;
    transition:
        transform 0.2s,
        box-shadow 0.2s;
    z-index: 0;
}

/* The Blurred Background.
   Crucial: We strictly limit its height to the image height variable.
   This prevents it from bleeding down into the caption area.
*/
.chronicler-content .gallery .blurred-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--gallery-height); /* Match the image height exactly */
    background-size: cover;
    background-position: center;
    filter: blur(20px) brightness(0.9);
    transform: scale(1.2); /* Hide blur edges */
    z-index: -1; /* Sit behind content */
    pointer-events: none;
}

.chronicler-content .gallery img {
    width: 100%;
    height: var(--gallery-height);
    object-fit: contain;
    display: block;
    margin: 0;
    /* Remove background color so blur shows through transparency */
    background-color: transparent;
    position: relative;
    z-index: 1; /* Sit above the blur */
}

/* Borders */
.chronicler-content .gallery figure img {
    border-bottom: 1px solid var(--color-border-primary);
}

.chronicler-content .gallery figure > img:last-child {
    border-bottom: none;
}

/* Captions */
.chronicler-content .gallery figcaption {
    padding: 0.5rem;
    font-size: 0.9rem;
    text-align: center;
    color: var(--color-text-secondary);
    background-color: var(--color-background-secondary);
}

/* --- Sortable Tables --- */
.chronicler-content .sortable-table thead th {
    cursor: pointer;
    transition: background-color 0.2s;
}

.chronicler-content .sortable-table thead th:hover {
    background-color: var(--color-background-secondary);
}

.chronicler-content .sortable-table th[role="columnheader"]::after {
    content: " \25B2"; /* Up arrow */
    font-size: 0.8em;
    opacity: 0.3;
}

.chronicler-content .sortable-table th[aria-sort="descending"]::after {
    content: " \25BC"; /* Down arrow */
    opacity: 1;
}

.chronicler-content .sortable-table th[aria-sort="ascending"]::after {
    content: " \25B2"; /* Up arrow */
    opacity: 1;
}

/* --- Layout Utilities (Float Container) --- */
.chronicler-content .float-container {
    display: flow-root;
    margin-bottom: 1.5em;
}

.chronicler-content .float-left {
    float: left;
    margin-right: 1.5em;
    margin-bottom: 0.5em;
}

.chronicler-content .float-right {
    float: right;
    margin-left: 1.5em;
    margin-bottom: 0.5em;
}

/* Override default header behavior for headers inside float container */
.chronicler-content .float-container > h1,
.chronicler-content .float-container > h2,
.chronicler-content .float-container > h3,
.chronicler-content .float-container > h4,
.chronicler-content .float-container > h5,
.chronicler-content .float-container > h6 {
    clear: none;
    display: block;
    overflow: hidden;
}

/* --- Math Styling --- */
/* Add basic padding if needed, although Katex handles most. */
.chronicler-content .math-display {
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0.5em 0;
}

/* Universal Spoiler Fix: Completely hide links inside hidden spoilers */
/* visibility: hidden keeps the space but prevents rendering of color, shadows, and borders */
.chronicler-content span.spoiler:not(.revealed) a {
    visibility: hidden;
}
</style>

  <script>(function () {
  const dataEl = document.getElementById("browser-sidebar-data");
  if (!dataEl) return;

  const data = JSON.parse(dataEl.textContent);
  const searchInput = document.getElementById("browser-sidebar-search");
  const filesPanel = document.querySelector('[data-panel="files"]');
  const tagsPanel = document.querySelector('[data-panel="tags"]');
  const galleryPanel = document.querySelector('[data-panel="gallery"]');
  const tabButtons = document.querySelectorAll("[data-sidebar-tab]");

  let activeTab = data.activeTab || "files";
  let searchTerm = "";
  let searchTimer = null;
  const expandedPaths = new Set(
    JSON.parse(sessionStorage.getItem("browser-expanded") || "[]"),
  );

  const placeholders = {
    files: "Search files...",
    tags: "Search tags...",
    gallery: "Search images...",
  };

  const ICONS = {
    folder: "/ithir-wiki/icons/default/Icons_Folder.svg",
    folderOpen: "/ithir-wiki/icons/default/Icons_FolderOpen.svg",
    file: "/ithir-wiki/icons/default/Icons_File.svg",
    image: "/ithir-wiki/icons/default/Icons_Image.svg",
    tags: "/ithir-wiki/icons/default/Icons_Tags.svg",
    gallery: "/ithir-wiki/icons/default/Icons_Gallery.svg",
  };

  function iconHtml(url) {
    return `<span class="themed-icon img-icon" style="--icon-url: url('${url}')" aria-hidden="true"></span>`;
  }

  function isDirectory(node) {
    return node.file_type === "Directory";
  }

  function isImage(node) {
    return node.file_type === "Image";
  }

  function saveExpanded() {
    sessionStorage.setItem(
      "browser-expanded",
      JSON.stringify([...expandedPaths]),
    );
  }

  function setActiveTab(tab) {
    activeTab = tab;
    searchTerm = "";
    if (searchInput) {
      searchInput.value = "";
      searchInput.placeholder = placeholders[tab] || "Search...";
    }
    tabButtons.forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.sidebarTab === tab);
    });
    if (filesPanel) filesPanel.hidden = tab !== "files";
    if (tagsPanel) tagsPanel.hidden = tab !== "tags";
    if (galleryPanel) galleryPanel.hidden = tab !== "gallery";
    renderActivePanel();
    sessionStorage.setItem("browser-sidebar-tab", tab);
  }

  function filterFileTree(node, term, showImages = true) {
    if (!node) return null;
    if (!showImages && isImage(node)) return null;

    const lowerTerm = term.toLowerCase();

    if (!term && !isDirectory(node)) {
      return node;
    }

    if (isDirectory(node)) {
      const filteredChildren = (node.children || [])
        .map((child) => filterFileTree(child, term, showImages))
        .filter(Boolean);

      if (!term) {
        return { ...node, children: filteredChildren };
      }

      if (
        node.name.toLowerCase().includes(lowerTerm) ||
        filteredChildren.length > 0
      ) {
        return { ...node, children: filteredChildren };
      }
    } else if (node.name.toLowerCase().includes(lowerTerm)) {
      return node;
    }

    return null;
  }

  function isPageActive(node) {
    if (!data.currentSlug) return false;
    const href = node.path || "";
    return href.endsWith("/" + data.currentSlug) || href === "/ithir-wiki/page/" + data.currentSlug;
  }

  function renderFileTreeNode(node, isSearching) {
    if (!node) return "";

    if (isDirectory(node)) {
      const pathKey = node.path || node.name;
      const expanded = isSearching || expandedPaths.has(pathKey);
      const children = (node.children || [])
        .map((child) => renderFileTreeNode(child, isSearching))
        .join("");

      const arrow = expanded ? "▼" : "►";
      const folderIcon = expanded ? ICONS.folderOpen : ICONS.folder;

      return `<div class="file-node">
        <div class="directory" data-path="${escapeAttr(pathKey)}" role="button" tabindex="0">
          <div class="label">
            <span class="arrow-icon">${arrow}</span>
            ${iconHtml(folderIcon)}
            <span class="node-name-text">${escapeHtml(node.name)}</span>
          </div>
        </div>
        ${expanded ? `<div class="children">${children}</div>` : ""}
      </div>`;
    }

    const activeClass = isPageActive(node) ? " active" : "";
    const href = escapeAttr(node.path || "#");
    return `<div class="file-node">
      <a class="file${activeClass}" href="${href}">
        ${iconHtml(ICONS.file)}
        <span class="node-name-text">${escapeHtml(node.name)}</span>
      </a>
    </div>`;
  }

  function renderFilesPanel() {
    if (!filesPanel) return;
    const filtered = filterFileTree(data.tree, searchTerm, true);
    const isSearching = !!searchTerm;

    if (!filtered || !(filtered.children || []).length && !isDirectory(filtered)) {
      filesPanel.innerHTML = '<p class="text-muted text-center">No files found.</p>';
      return;
    }

    const rootChildren = isDirectory(filtered)
      ? filtered.children || []
      : [filtered];
    const html = rootChildren
      .map((child) => renderFileTreeNode(child, isSearching))
      .join("");

    filesPanel.innerHTML = `<div class="file-explorer">${html}</div>`;

    filesPanel.querySelectorAll(".directory").forEach((dir) => {
      const toggle = () => {
        const pathKey = dir.dataset.path;
        if (!pathKey) return;
        if (expandedPaths.has(pathKey)) {
          expandedPaths.delete(pathKey);
        } else {
          expandedPaths.add(pathKey);
        }
        saveExpanded();
        renderFilesPanel();
      };
      dir.addEventListener("click", toggle);
      dir.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggle();
        }
      });
    });
  }

  function renderTagsPanel() {
    if (!tagsPanel) return;
    const term = searchTerm.toLowerCase();
    const filtered = (data.tags || []).filter((entry) =>
      entry.tag.toLowerCase().includes(term),
    );

    if (!filtered.length) {
      tagsPanel.innerHTML = '<p class="text-muted text-center">No tags found.</p>';
      return;
    }

    const items = filtered
      .map((entry) => {
        const href = "/ithir-wiki/tag/" + encodeURIComponent(entry.tag);
        const active =
          data.currentTag && data.currentTag.toLowerCase() === entry.tag.toLowerCase()
            ? " active"
            : "";
        return `<a class="tag-group${active}" href="${href}">
          <span class="tag-name">#${escapeHtml(entry.tag)}</span>
          <span class="tag-count">(${entry.pages.length})</span>
        </a>`;
      })
      .join("");

    tagsPanel.innerHTML = `<div class="tag-list">${items}</div>`;
  }

  function renderGalleryPanel() {
    if (!galleryPanel) return;
    const term = searchTerm.toLowerCase();
    const filtered = (data.gallery || []).filter((img) =>
      img.title.toLowerCase().includes(term),
    );

    if (!filtered.length) {
      galleryPanel.innerHTML =
        '<p class="text-muted text-center">No images found.</p>';
      return;
    }

    const INITIAL_BATCH = 50;
    const LOAD_BATCH = 50;
    let displayLimit = INITIAL_BATCH;

    function renderBatch() {
      const visible = filtered.slice(0, displayLimit);
      const items = visible
        .map((img) => {
          return `<a class="gallery-item" href="${escapeAttr(img.asset_url)}" title="${escapeAttr(img.title)}">
            <img src="${escapeAttr(img.asset_url)}" alt="${escapeAttr(img.title)}" loading="lazy" />
            <div class="gallery-caption">${escapeHtml(img.title)}</div>
          </a>`;
        })
        .join("");

      const hasMore = displayLimit < filtered.length;
      galleryPanel.innerHTML = `<div class="gallery-container">
        <div class="gallery-grid">${items}</div>
        ${hasMore ? '<div class="load-trigger" style="height:20px;width:100%"></div>' : ""}
      </div>`;

      const trigger = galleryPanel.querySelector(".load-trigger");
      if (trigger) {
        const observer = new IntersectionObserver(
          (entries) => {
            if (entries.some((e) => e.isIntersecting)) {
              displayLimit = Math.min(displayLimit + LOAD_BATCH, filtered.length);
              observer.disconnect();
              renderBatch();
            }
          },
          { root: galleryPanel, rootMargin: "100px" },
        );
        observer.observe(trigger);
      }
    }

    displayLimit = INITIAL_BATCH;
    renderBatch();
  }

  function renderActivePanel() {
    if (activeTab === "files") renderFilesPanel();
    else if (activeTab === "tags") renderTagsPanel();
    else if (activeTab === "gallery") renderGalleryPanel();
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(value) {
    return escapeHtml(value);
  }

  if (searchInput) {
    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchTerm = searchInput.value.trim();
        renderActivePanel();
      }, 300);
    });
    searchInput.placeholder = placeholders[activeTab] || "Search...";
  }

  tabButtons.forEach((btn) => {
    btn.addEventListener("click", () => setActiveTab(btn.dataset.sidebarTab));
  });

  const savedTab = sessionStorage.getItem("browser-sidebar-tab");
  if (savedTab && ["files", "tags", "gallery"].includes(savedTab)) {
    activeTab = savedTab;
  }
  setActiveTab(activeTab);
})();
</script>
